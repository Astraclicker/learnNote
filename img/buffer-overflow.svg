<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <marker id="bo-arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ff7262"/>
    </marker>
  </defs>
  <rect width="900" height="424" fill="#1e1e1e"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#e8e8e8">缓冲区溢出：越界写入顺着地址向上覆盖返回地址</text>

  <text x="290" y="62" text-anchor="end" font-size="12" fill="#9aa0a6">高地址</text>
  <text x="290" y="292" text-anchor="end" font-size="12" fill="#9aa0a6">低地址</text>

  <rect x="300" y="54" width="330" height="50" fill="#262626" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="316" y="84" font-size="13" fill="#b0b0b0">调用者的栈帧</text>

  <rect x="300" y="104" width="330" height="52" fill="#2e1a17" stroke="#ff7262" stroke-width="2"/>
  <text x="316" y="126" font-size="13" fill="#ff8a7a">返回地址</text>
  <text x="316" y="145" font-size="11.5" fill="#c98f88">返回调用者中 call 的下一条指令</text>

  <rect x="300" y="156" width="330" height="48" fill="#262626" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="316" y="185" font-size="13" fill="#b0b0b0">保存的 %rbp</text>

  <rect x="300" y="204" width="330" height="64" fill="#142235" stroke="#5aa9ff" stroke-width="1.5"/>
  <text x="316" y="228" font-size="13" fill="#79bbff">char buf[8]：局部数组，只有 8 个字节</text>
  <text x="316" y="250" font-size="11.5" fill="#8fa8c8">gets / strcpy / strcat 不检查长度</text>

  <line x1="290" y1="272" x2="640" y2="272" stroke="#e0b341" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="300" y="292" font-size="12" fill="#e0b341">%rsp</text>

  <line x1="662" y1="262" x2="662" y2="112" stroke="#ff7262" stroke-width="2" marker-end="url(#bo-arrow)"/>
  <line x1="656" y1="198" x2="668" y2="198" stroke="#ff7262" stroke-width="1"/>
  <text x="690" y="200" font-size="12" fill="#ff8a7a" transform="rotate(-90 690 200)" text-anchor="middle">越界写入的方向</text>

  <text x="56" y="330" font-size="12.5" fill="#d6d6d6">① 输入先填满 buf[0..7] 这 8 个字节；</text>
  <text x="56" y="354" font-size="12.5" fill="#d6d6d6">② 再写就冲出缓冲区，覆盖保存的 %rbp；</text>
  <text x="56" y="378" font-size="12.5" fill="#d6d6d6">③ 继续写会覆盖返回地址，函数 ret 时弹出的是被改写过的地址，控制流被劫持；</text>
  <text x="56" y="402" font-size="12.5" fill="#d6d6d6">④ 若把机器码放进缓冲区并让返回地址指向它，就是最经典的 shellcode 攻击 —— 防御办法见 3.10.4。</text>
</svg>
