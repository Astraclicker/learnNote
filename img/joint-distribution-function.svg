<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <rect width="900" height="480" fill="#1e1e1e"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#e8e8e8">联合分布函数 F(x,y) 的几何意义</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c8c8c8"/>
    </marker>
  </defs>

  <rect x="150" y="180" width="330" height="200" fill="#5aa9ff" opacity="0.10"/>

  <g stroke="#3a3a3a" stroke-width="1" stroke-dasharray="4 4">
    <line x1="250" y1="380" x2="250" y2="120"/>
    <line x1="380" y1="380" x2="380" y2="120"/>
    <line x1="510" y1="380" x2="510" y2="120"/>
    <line x1="640" y1="380" x2="640" y2="120"/>
    <line x1="150" y1="300" x2="700" y2="300"/>
    <line x1="150" y1="220" x2="700" y2="220"/>
    <line x1="150" y1="140" x2="700" y2="140"/>
  </g>

  <line x1="150" y1="380" x2="840" y2="380" stroke="#c8c8c8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="150" y1="380" x2="150" y2="80" stroke="#c8c8c8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="846" y="368" font-size="13" fill="#a8a8ad">x</text>
  <text x="158" y="74" font-size="13" fill="#a8a8ad">y</text>

  <g font-size="12.5" fill="#a8a8ad" text-anchor="middle">
    <text x="250" y="402">x₁</text>
    <text x="380" y="402">x₂</text>
    <text x="510" y="402">x₃</text>
    <text x="640" y="402">x₄</text>
  </g>
  <g font-size="12.5" fill="#a8a8ad" text-anchor="end">
    <text x="138" y="304">y₁</text>
    <text x="138" y="224">y₂</text>
    <text x="138" y="144">y₃</text>
  </g>

  <g stroke="#5aa9ff" stroke-width="1.6" stroke-dasharray="6 4">
    <line x1="480" y1="380" x2="480" y2="180"/>
    <line x1="150" y1="180" x2="480" y2="180"/>
  </g>
  <text x="490" y="172" font-size="12.5" fill="#5aa9ff">(x, y)</text>

  <g fill="#5aa9ff">
    <circle cx="250" cy="300" r="5"/>
    <circle cx="380" cy="300" r="5"/>
    <circle cx="250" cy="220" r="5"/>
    <circle cx="380" cy="220" r="5"/>
  </g>
  <g fill="#1e1e1e" stroke="#7f8c9b" stroke-width="1.8">
    <circle cx="510" cy="300" r="5"/>
    <circle cx="640" cy="300" r="5"/>
    <circle cx="510" cy="220" r="5"/>
    <circle cx="640" cy="220" r="5"/>
    <circle cx="250" cy="140" r="5"/>
    <circle cx="380" cy="140" r="5"/>
    <circle cx="510" cy="140" r="5"/>
    <circle cx="640" cy="140" r="5"/>
  </g>

  <circle cx="250" cy="300" r="9" fill="none" stroke="#5aa9ff" stroke-width="1.4" opacity="0.6"/>
  <text x="262" y="296" font-size="12" fill="#79bbff">p₁₁</text>

  <text x="450" y="436" text-anchor="middle" font-size="13" fill="#d6d6d6">F(x, y) 等于左下角区域内全部格点的概率之和</text>
  <text x="450" y="460" text-anchor="middle" font-size="12.5" fill="#a8a8ad">实心点：xᵢ ≤ x 且 yⱼ ≤ y，这些 pᵢⱼ 相加；空心点在区域外，不计入</text>
</svg>
