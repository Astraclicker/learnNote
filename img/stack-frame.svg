<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <marker id="sf-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6a6a6a"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#1e1e1e"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#e8e8e8">运行时栈与栈帧（栈向低地址方向增长）</text>

  <line x1="300" y1="62" x2="300" y2="370" stroke="#6a6a6a" stroke-width="1.5" marker-end="url(#sf-arrow)"/>
  <text x="290" y="66" text-anchor="end" font-size="12" fill="#9aa0a6">高地址</text>
  <text x="290" y="374" text-anchor="end" font-size="12" fill="#9aa0a6">低地址</text>

  <rect x="318" y="60" width="340" height="50" fill="#262626" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="334" y="90" font-size="13" fill="#b0b0b0">调用者的栈帧（caller）</text>
  <text x="674" y="90" font-size="11.5" fill="#9aa0a6">由调用者事先分配</text>

  <rect x="318" y="110" width="340" height="48" fill="#142235" stroke="#5aa9ff" stroke-width="1.5"/>
  <text x="334" y="139" font-size="13" fill="#79bbff">参数构造区（第 7 个及以后的参数）</text>
  <text x="674" y="139" font-size="11.5" fill="#9aa0a6">参数超过 6 个时才用</text>

  <rect x="318" y="158" width="340" height="46" fill="#2e1a17" stroke="#ff7262" stroke-width="1.5"/>
  <text x="334" y="186" font-size="13" fill="#ff8a7a">返回地址（call 指令压入）</text>
  <text x="674" y="186" font-size="11.5" fill="#9aa0a6">ret 时从这里弹出</text>

  <rect x="318" y="204" width="340" height="52" fill="#14291c" stroke="#45d483" stroke-width="1.5"/>
  <text x="334" y="224" font-size="13" fill="#5ee08f">被调用者保存的寄存器</text>
  <text x="334" y="244" font-size="11.5" fill="#79c98f">%rbx、%rbp、%r12–%r15（被用到的才压栈）</text>
  <text x="674" y="236" font-size="11.5" fill="#9aa0a6">push 保存 / pop 恢复</text>

  <rect x="318" y="256" width="340" height="80" fill="#131a2a" stroke="#7f8fd8" stroke-width="1.5"/>
  <text x="334" y="282" font-size="13" fill="#a9b6f5">局部变量 / 数组 / 结构体</text>
  <text x="334" y="302" font-size="11.5" fill="#9aa0a6">需要取地址、或数组结构体必须在这里</text>
  <text x="334" y="322" font-size="11.5" fill="#9aa0a6">编译器用 subq 一次分配好整块空间</text>
  <text x="674" y="300" font-size="11.5" fill="#9aa0a6">subq 分配 / addq 释放</text>

  <line x1="300" y1="336" x2="680" y2="336" stroke="#e0b341" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="318" y="360" font-size="12" fill="#e0b341">%rsp 指向栈顶（最低的已用地址）</text>

  <text x="56" y="394" font-size="12" fill="#9aa0a6">• 栈帧由调用者和被调用者共同拼成：返回地址与保存的寄存器是「接口」，局部变量是被调用者的私有空间</text>
  <text x="56" y="418" font-size="12" fill="#9aa0a6">• 因为栈向低地址增长，「分配空间」是 subq、「释放空间」是 addq，方向不要记反</text>
</svg>
